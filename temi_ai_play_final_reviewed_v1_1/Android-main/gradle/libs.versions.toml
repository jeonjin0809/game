[versions]
# ⚠ 고정 버전: 이유는 CLAUDE.md "고정 버전" 참고. 허락 없이 올리지 말 것.
agp = "9.4.1"
temiSdk = "0.10.80"
mediapipe = "0.10.21"      # armeabi-v7a 네이티브 라이브러리를 포함하는 마지막 버전
desugarJdkLibs = "2.1.5"   # API 23(temi)에서 java.util.Optional 등 사용
camerax = "1.2.3"          # 1.3+는 compileSdk 34 필요
okhttp = "4.12.0"
appcompat = "1.6.1"
material = "1.5.0"
constraintlayout = "2.1.4"
junit = "4.13.2"
androidxJunit = "1.1.5"
espressoCore = "3.5.1"

[libraries]
temi-sdk = { group = "com.robotemi", name = "sdk", version.ref = "temiSdk" }
mediapipe-tasks-vision = { group = "com.google.mediapipe", name = "tasks-vision", version.ref = "mediapipe" }
desugar-jdk-libs = { group = "com.android.tools", name = "desugar_jdk_libs", version.ref = "desugarJdkLibs" }
camerax-core = { group = "androidx.camera", name = "camera-core", version.ref = "camerax" }
camerax-camera2 = { group = "androidx.camera", name = "camera-camera2", version.ref = "camerax" }
camerax-lifecycle = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "camerax" }
camerax-view = { group = "androidx.camera", name = "camera-view", version.ref = "camerax" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxJunit" }
espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }

[bundles]
camerax = ["camerax-core", "camerax-camera2", "camerax-lifecycle", "camerax-view"]

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
